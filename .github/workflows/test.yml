name: Test backup kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check zsh syntax
        run: zsh -n codex_backup.sh install.command backup-now.command uninstall.command *.command
      - name: Run macOS fixture tests
        run: |
          zsh tests/test_macos.sh
          zsh tests/test_macos_install.sh
          zsh tests/test_macos_restore.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Run Windows fixture tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_windows.ps1
