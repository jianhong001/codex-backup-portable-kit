name: Test backup kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check zsh syntax
        run: zsh -n codex_macos_common.sh codex_backup.sh codex_restore_macos.sh scheduled-launcher.command install.command backup-now.command uninstall.command export-to-drive.command *.command scripts/build-release.sh
      - name: Run macOS fixture tests
        run: |
          zsh tests/test_macos.sh
          zsh tests/test_macos_install.sh
          zsh tests/test_macos_restore.sh
          zsh tests/test_macos_selected.sh
      - name: Build and inspect portable release
        run: |
          zsh scripts/build-release.sh
          archive="dist/codex-backup-kit-v$(< VERSION).zip"
          unzip -tq "$archive"
          unzip -Z1 "$archive" > dist/archive-entries.txt
          scan_status=0
          /usr/bin/grep -Ei '(^|/)(auth\.json|.*\.sqlite|.*\.log|codex-local-backup-)' dist/archive-entries.txt || scan_status=$?
          test "$scan_status" -eq 1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Run Windows fixture tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_windows.ps1
